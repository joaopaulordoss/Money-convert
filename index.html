<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Convert Money</title>
</head>

<body>
    <img class="logo" src="./assets/Logo-Preta-sf.png" alt="logo-convert-money" />

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <options>R$ Real Brasileiro</options>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select>
                <options>US$ Dólar Americado</options>
                <options>€ Euro</options>
                <options>£ Libra Esterlina</options>
                <options>₿ Bitcoin</options>
            </select>
        </label>

        <label>
            Valor
            <input placeholder="R$ 10.000,00">
        </label>

        <button>Converter</button>

        <section>
            <div>
                <img src="./assets/real.png" alt="logo-moeda-a-converter" />
                <p>Real</p>
                <p>RS 0,00</p>
            </div>

            <img src="./assets/arrow.png" alt="seta">

            <div>
                <img src="./assets/dolar.png" alt="logo-moeda-convertida" />
                <p>Dólar</p>
                <p>US$ 0.0</p>
            </div>
        </section>

    </main>

</html>
